# Keystone dependency lock.
#
# Resolved from requirements.txt against the installed environment by
# scripts/generate_lock.py. Scoped to this project's declared dependencies on
# purpose: a full `pip freeze` would emit editable installs as absolute local
# paths, publishing the maintainer's home directory and unrelated private
# project names into a public repo, and would pin hundreds of packages that
# have nothing to do with this project.
#
# Regenerate:  python scripts/generate_lock.py
