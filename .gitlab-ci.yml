# Keystone CI: prove the engine on every push, and publish the web hero to
# GitLab Pages with no extra accounts or paid services. Pushing to GitLab gives
# a green test badge AND a judge-clickable live link at the Pages URL.
stages:
  - diagnose
  - test
  - gate
  - secure
  - release
  - deploy

# --- diagnostics --------------------------------------------------------------
# Never blocks (allow_failure) and never fails. Its only job is to capture WHY a
# later stage might fail on a runner we do not control, and publish it as an
# artifact. A red pipeline with no log is the worst possible state for a reviewer;
# this removes that blind spot. If this job's artifact is empty and the pipeline is
# still red, the failure is outside the job script itself (runner provisioning,
# image pull, or scheduling).
diagnose:
  stage: diagnose
  image: python:3.13-slim
  allow_failure: true
  script:
    - mkdir -p diagnose
    - |
      {
        echo "=== uname ===";        uname -a
        echo "=== python ===";       python -V; which python
        echo "=== pip ===";          python -m pip --version
        echo "=== git config ===";   git config --list | grep -Ei 'autocrlf|eol|filemode' || echo "(none relevant)"
        echo "=== git status ===";   git status --porcelain | head -20
      } > diagnose/env.txt 2>&1 || true
    - python -m pip install --quiet -r requirements.txt > diagnose/pipinstall.txt 2>&1 || echo "PIP_INSTALL_FAILED" >> diagnose/pipinstall.txt
    - python -m pip freeze > diagnose/pipfreeze.txt 2>&1 || true
    - |
      {
        echo "=== data/ on disk ==="
        ls -la data/ || true
        echo "=== tracked data/ files ==="
        git ls-files data/
        echo "=== web/data.json sha ==="
        sha256sum web/data.json || true
      } > diagnose/files.txt 2>&1 || true
    - |
      {
        echo "=== pytest ==="
        python -m pytest -q 2>&1 | tail -40
        echo "PYTEST_EXIT=$?"
      } > diagnose/pytest.txt 2>&1 || true
    - |
      {
        echo "=== build_static ==="
        python scripts/build_static.py 2>&1 | tail -20
        echo "BUILD_STATIC_EXIT=$?"
        echo "=== drift ==="
        git diff --exit-code -- web/data.json && echo "DRIFT_CLEAN" || echo "DRIFT_DIRTY"
        git diff --stat -- web/data.json
      } > diagnose/static.txt 2>&1 || true
    - |
      {
        echo "=== governance-gate cmd1 ==="
        python skills/keystone/run_review.py metrics --local --fixture --fail-on-block 2>&1 | tail -25
        echo "GATE1_EXIT=$?"
      } > diagnose/gate.txt 2>&1 || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - diagnose/
  rules:
    - when: always

test:
  stage: test
  image: python:3.13-slim
  script:
    - pip install --quiet -r requirements.txt
    - python -m pytest -q
    # committed static bundle must equal a fresh build from the committed real Orbit
    # self-index + provenance + recorded agent sample (no silent drift)
    - python scripts/build_static.py
    - git diff --exit-code -- web/data.json
  rules:
    - when: always

# Enforceable governance gate: fails the pipeline (exit non-zero) when a touched
# symbol carries a prior identical-blast-radius rejection. Run in-process, no server.
# This turns the review from voluntary tooling into a real CI control. Point the
# symbol at what an MR actually changes (here a clean symbol keeps the demo green).
governance-gate:
  stage: gate
  image: python:3.13-slim
  # Mint a GitLab OIDC ID token for THIS job. The runner injects it as $KEYSTONE_ID_TOKEN;
  # Keystone binds the recorded actor to its `sub` claim, so a pipeline decision is
  # GitLab-attested (self_asserted=False), closing the self-asserted-identity gap on the
  # path that matters most for supply-chain attestation.
  id_tokens:
    KEYSTONE_ID_TOKEN:
      aud: https://keystone.example/ci
  variables:
    # verify the token's RS256 signature against the issuer JWKS and enforce the audience the
    # id_tokens block above minted, so the bound identity is cryptographically checked, not just
    # decoded. KEYSTONE_STRICT_OVERRIDE refuses an override that is not identity-bound.
    KEYSTONE_VERIFY_OIDC: "1"
    KEYSTONE_OIDC_AUD: https://keystone.example/ci
    KEYSTONE_STRICT_OVERRIDE: "1"
  script:
    - pip install --quiet -r requirements.txt
    # the SAME policy gate the API uses: a clean symbol passes, a BLOCKed one fails
    - python skills/keystone/run_review.py metrics --local --fixture --fail-on-block
    # record a GitLab-ATTESTED approval (the output shows "identity: GitLab-attested",
    # not self-asserted) to demonstrate the cryptographically-bound actor on the CI path
    - python skills/keystone/run_review.py metrics --local --fixture --decide approve --reviewer "$GITLAB_USER_LOGIN" --reason "pipeline-gated approval (OIDC-bound actor)"
  rules:
    - when: always

# Demonstration that the gate BLOCKS a contradicted change. allow_failure keeps the
# pipeline green while showing the refusal; in a real MR this would block the merge.
governance-gate-demo:
  stage: gate
  image: python:3.13-slim
  allow_failure: true
  script:
    - pip install --quiet -r requirements.txt
    - python skills/keystone/run_review.py tokenize --local --fixture --fail-on-block
  rules:
    - when: always

# --- secure + release: dependency-risk propagation -----------------------------
# A dependency scanner answers "this package has a CVE". Keystone answers the
# question you actually have to act on: which of OUR definitions import it, how far
# the damage travels from each, and which directory owns the blast.
#
# advisory -> gl_imported_symbol (real import edges) -> gl_definition -> reverse-BFS
# blast radius -> ALLOW / HOLD / BLOCK. No network call, no LLM: identical inputs
# give identical output, so this gate cannot flap between runs.
dependency-risk:
  stage: secure
  image: python:3.13-slim
  script:
    - pip install --quiet -r requirements.txt
    - python scripts/dependency_risk.py
  artifacts:
    when: always
    paths:
      - dependency-risk.json
  after_script:
    - python scripts/dependency_risk.py --json > dependency-risk.json || true
  rules:
    - when: always

# Enforceable release gate. Exits non-zero on BLOCK, so a vulnerable dependency
# that this repo actually imports and actually depends on cannot ship. The
# severity is NOT what fails the build -- an untouched transitive dep is not a
# release blocker. The propagated blast radius is.
release-gate:
  stage: release
  image: python:3.13-slim
  script:
    - pip install --quiet -r requirements.txt
    - python scripts/dependency_risk.py --fail-on-block
  rules:
    - if: $CI_COMMIT_TAG
    - when: never

# Publishes the self-contained static hero (live-API-first, FALLBACK bundle when
# no backend is reachable). build_static.py regenerates web/data.json from the
# engine, then web/ is copied to public/ which GitLab Pages serves.
pages:
  stage: deploy
  image: python:3.13-slim
  script:
    - pip install --quiet -r requirements.txt
    - python scripts/build_static.py
    - python -c "import json; d=json.load(open('web/data.json')); assert d['definitions'] and d['impact']"
    - rm -rf public && mkdir public && cp -r web/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
