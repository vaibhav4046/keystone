# Keystone CI on GitHub: run the engine tests on every push, and publish the
# self-contained web hero to GitHub Pages. Mirrors .gitlab-ci.yml so the repo
# yields a green badge and a live link on either host, with no paid services.
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install --quiet -r requirements.txt
      - run: python -m pytest -q
      # enforceable governance gate (in-process, SAME gate as the API): a clean
      # symbol passes; a BLOCKed symbol exits non-zero.
      - run: python skills/keystone/run_review.py metrics --local --fixture --fail-on-block
      # prove the gate BLOCKS a contradicted change (must exit non-zero); inverted so
      # the pipeline stays green while demonstrating the block.
      - run: "! python skills/keystone/run_review.py tokenize --local --fixture --fail-on-block"
      # --- dependency-risk propagation (advisory -> import edges -> blast radius) ---
      - run: python scripts/dependency_risk.py
      # Proves the release gate BLOCKS a real exposure: the shipped example set
      # includes a CRITICAL advisory on a package this repo imports, so the gate
      # must exit non-zero. Inverted so CI stays green while demonstrating the block.
      - run: "! python scripts/dependency_risk.py --fail-on-block"
      # And that the same gate ALLOWS when nothing is actually exposed, so it cannot
      # pass by always failing. pydantic 2.13.4 is outside the example advisory's
      # affected range, so a correct engine reports no exposure and exits 0.
      - run: python scripts/dependency_risk.py --package pydantic --fail-on-block
      # --- incident recall: were the recorded predictions right? ----------------
      # Reported, not fatal: an understated prediction is a finding to act on, and
      # a pipeline that goes red for it would train people to ignore the one job
      # that reports the memory is incomplete. The enforceable form is behind a tag.
      - run: python scripts/incident_recall.py
      - run: "! python scripts/incident_recall.py --fail-on-understated"
      # --- configuration drift: are approvals still made under today's rules? ----
      # Reported, not fatal: a policy change is often intended and the right response
      # is to re-review, not to red the build. The enforceable form is behind a tag.
      - run: python scripts/config_drift.py
      # Non-inverted, unlike the two gates above. The shipped policy has not
      # drifted, so the gate MUST pass here. Asserting it that way is the point: it
      # proves the gate does not fire on a clean tree, which is the failure mode that
      # would make people disable it. The opposite direction (DRIFT -> non-zero) is
      # covered by the unit tests, where the drift is constructed deliberately.
      - run: python scripts/config_drift.py --fail-on-drift
      # committed static bundle must equal a fresh build from the committed real Orbit
      # self-index + provenance + recorded agent sample (no silent drift; no orbit binary
      # or network needed - the build reads only committed artifacts)
      - run: python scripts/build_static.py
      - run: git diff --exit-code -- web/data.json

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install --quiet -r requirements.txt
      - run: python scripts/build_static.py
      - run: python -c "import json,sys; d=json.load(open('web/data.json')); assert d['definitions'] and d['impact']; print('data.json valid:', len(d['definitions']), 'symbols')"
      - run: mkdir -p public && cp -r web/* public/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
